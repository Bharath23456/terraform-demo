apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraform-demo
  template:
    metadata:
      labels:
        app: terraform-demo
    spec:
      containers:
        - name: web
          image: terraform-demo:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"